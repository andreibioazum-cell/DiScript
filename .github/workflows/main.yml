name: Build Cubic Battle 4 (APK + EXE)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-pc:
    name: Build Windows .exe (PC version)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check game state, resources and disco loop
        run: |
          CC=gcc python3 tools/test_game_state.py
          python3 tools/test_resources.py
          CC=gcc python3 tools/test_audio_loop.py
          CC=gcc python3 tools/test_backspace_repeat.py

      - name: Install Zig
        run: pip install ziglang

      - name: Build CubicBattle4.exe
        run: python3 tools/build_pc.py --windows

      - name: Stage Windows package
        run: |
          set -euo pipefail
          mkdir -p build/pc/dist
          cp build/pc/CubicBattle4.exe build/pc/dist/
          cp -r build/pc/assets build/pc/dist/assets
          test -f build/pc/dist/assets/grass.png
          test -f build/pc/dist/assets/fonts/ComicRelief-Regular.ttf
          test -f build/pc/dist/assets/sounds/lobbymusic.wav
          test -f build/pc/dist/assets/sounds/winter_jingle.wav
          test -f build/pc/dist/assets/sounds/duel_theme.wav
          test -f build/pc/dist/assets/sounds/disco_medusae_kevin_macleod.mp3
          test -f build/pc/dist/assets/sounds/Disco-Medusae-NOTICE.txt
          test -f build/pc/dist/assets/sounds/licenses/Disco-Medusae-CC-BY-4.0.txt
          test -f build/pc/dist/assets/hack/h4c4k0r.so
          (cd build/pc/dist && zip -qr "$GITHUB_WORKSPACE/CubicBattle4-Windows.zip" CubicBattle4.exe assets)

      - name: Publish Windows .exe to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-build"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Latest Build (APK + EXE)" \
              --notes "Automated Android APK and Windows EXE build (${{ github.sha }})." \
              --prerelease || true
          fi
          sha256sum CubicBattle4-Windows.zip build/pc/CubicBattle4.exe > windows.sha256
          cat windows.sha256
          REPO="${{ github.repository }}"
          ZIP_SIZE="$(stat -c%s CubicBattle4-Windows.zip)"
          EXE_SIZE="$(stat -c%s build/pc/CubicBattle4.exe)"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" CubicBattle4-Windows.zip build/pc/CubicBattle4.exe windows.sha256 --clobber; then
              ZIP_REMOTE="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="CubicBattle4-Windows.zip") | .size' 2>/dev/null || echo 0)"
              EXE_REMOTE="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="CubicBattle4.exe") | .size' 2>/dev/null || echo 0)"
              if [ "$ZIP_REMOTE" = "$ZIP_SIZE" ] && [ "$EXE_REMOTE" = "$EXE_SIZE" ]; then
                echo "windows assets match: $ZIP_REMOTE and $EXE_REMOTE bytes"
                break
              fi
              echo "windows assets mismatch ($ZIP_REMOTE/$EXE_REMOTE), re-uploading"
              for NAME in CubicBattle4-Windows.zip CubicBattle4.exe; do
                ASSET_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$NAME\") | .id" 2>/dev/null || true)"
                if [ -n "$ASSET_ID" ]; then
                  gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID" || true
                fi
              done
            fi
            sleep 2
          done
          echo "### Windows Build Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- [CubicBattle4-Windows.zip (EXE + assets)](https://github.com/${{ github.repository }}/releases/download/$TAG/CubicBattle4-Windows.zip)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [CubicBattle4.exe](https://github.com/${{ github.repository }}/releases/download/$TAG/CubicBattle4.exe)" >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK (Android 8-15)
    runs-on: ubuntu-24.04
    env:
      CC: clang

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java for Android build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and NDK
        id: android-tools
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt" ]; then
            if [ ! -x "$SDKM" ]; then
              TMP="$(mktemp -d)"
              curl -fsSL -o "$TMP/tools.zip" \
                https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
              unzip -q "$TMP/tools.zip" -d "$TMP"
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm -rf "$TMP"
            fi
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;34.0.0"
          fi
          NDK_PATH=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            for cand in $(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V -r); do
              if [ -x "$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ] && \
                 [ -f "$cand/sources/android/native_app_glue/android_native_app_glue.c" ]; then
                NDK_PATH="$cand"
                break
              fi
            done
          fi
          if [ -z "$NDK_PATH" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi
          echo "Using NDK: $NDK_PATH"
          echo "ndk-path=$NDK_PATH" >> "$GITHUB_OUTPUT"

      - name: Stage assets
        run: python3 stage_assets.py assets staging/assets

      - name: Build native libraries
        env:
          NDK_ROOT: ${{ steps.android-tools.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"
          C_SOURCES=(src/game/game.c src/engine/runtime.c src/platform/android/android_main.c "$GLUE/android_native_app_glue.c")
          CPP_SOURCE=src/game/cpp/ui_fx.cpp
          C_OPTS=(-std=c99 -O3 -s -fPIC -shared -Isrc -I. -I"$GLUE" -landroid -llog -ldl -lm -lvulkan
                  -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384)
          CPP_OPTS=(-std=c++17 -fno-exceptions -fno-rtti -O3 -s -fPIC -Isrc)
          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64
          pids=()
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            case "$ABI" in
              arm64-v8a) TRIPLE=aarch64-linux-android26;;
              armeabi-v7a) TRIPLE=armv7a-linux-androideabi26;;
              x86_64) TRIPLE=x86_64-linux-android26;;
            esac
            (
              "$TOOLCHAIN/$TRIPLE-clang++" "${CPP_OPTS[@]}" -c "$CPP_SOURCE" -o "staging/ui_fx_$ABI.o"
              "$TOOLCHAIN/$TRIPLE-clang" "${C_OPTS[@]}" "${C_SOURCES[@]}" "staging/ui_fx_$ABI.o" \
                -o "staging/lib/$ABI/libcb_game.so"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

      - name: Package and sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -s staging/classes.dex
          test -s staging/lib/arm64-v8a/libcb_game.so
          test -s staging/lib/armeabi-v7a/libcb_game.so
          test -s staging/lib/x86_64/libcb_game.so
          "$BT/aapt" package -f \
            -M platform/android/AndroidManifest.xml \
            -S platform/android/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -A staging/assets \
            -F unsigned.apk
          (
            cd staging
            zip -q -r ../unsigned.apk classes.dex lib
          )
          unzip -t unsigned.apk >/dev/null
          APK_FILES="$(unzip -Z1 unsigned.apk)"
          for required in \
            assets/grass.png \
            assets/ordinary_gold.png \
            assets/astra_xastra_card.png \
            assets/sounds/lobbymusic.wav \
            assets/sounds/disco_medusae_kevin_macleod.mp3 \
            assets/sounds/Disco-Medusae-NOTICE.txt \
            assets/sounds/licenses/Disco-Medusae-CC-BY-4.0.txt \
            assets/fonts/ComicRelief-Regular.ttf \
            classes.dex \
            lib/arm64-v8a/libcb_game.so \
            lib/armeabi-v7a/libcb_game.so \
            lib/x86_64/libcb_game.so; do
            grep -Fxq "$required" <<< "$APK_FILES"
          done
          "$BT/aapt" dump badging unsigned.apk > unsigned.badging
          grep -Fq "package: name='com.cb4'" unsigned.badging
          "$BT/zipalign" -v 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks platform/android/debug.keystore --ks-type PKCS12 \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out Game.apk aligned.apk
          "$BT/zipalign" -c -v 4 Game.apk
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 26 Game.apk
          unzip -Z1 Game.apk | grep -Eq "META-INF/.*\.(RSA|DSA|EC)$"
          "$BT/aapt" dump badging Game.apk > Game.badging
          grep -Fq "package: name='com.cb4'" Game.badging
          unzip -t Game.apk >/dev/null
          cp Game.apk CubicBattle4.apk

      - name: Publish Android APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-build"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Latest Build (APK + EXE)" \
              --notes "Automated Android APK and Windows EXE build (${{ github.sha }})." \
              --prerelease || true
          fi
          SIZE="$(stat -c%s CubicBattle4.apk)"
          SHA="$(sha256sum CubicBattle4.apk | cut -d' ' -f1)"
          printf '%s  CubicBattle4.apk\n' "$SHA" > CubicBattle4.apk.sha256
          echo "local apk: $SIZE bytes, sha256 $SHA"
          REPO="${{ github.repository }}"
          REMOTE=""
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" CubicBattle4.apk CubicBattle4.apk.sha256 --clobber; then
              REMOTE="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="CubicBattle4.apk") | .size' 2>/dev/null || echo 0)"
              if [ "$REMOTE" = "$SIZE" ]; then
                echo "release apk matches: $REMOTE bytes"
                break
              fi
              echo "release apk size $REMOTE != $SIZE, dropping the asset and retrying"
              ASSET_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="CubicBattle4.apk") | .id' 2>/dev/null || true)"
              if [ -n "$ASSET_ID" ]; then
                gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID" || true
              fi
            fi
            sleep 2
          done
          if [ "$REMOTE" != "$SIZE" ]; then
            echo "::error::published APK is $REMOTE bytes, expected $SIZE"
            exit 1
          fi
          gh release edit "$TAG" \
            --notes "$(printf 'Automated Android APK and Windows EXE build (%s).\n\nAPK: %s bytes\nsha256: %s\nThe same hash is in CubicBattle4.apk.sha256 next to the APK.' "${{ github.sha }}" "$SIZE" "$SHA")" >/dev/null 2>&1 || true
          echo "### Android APK Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- [CubicBattle4.apk](https://github.com/${{ github.repository }}/releases/download/$TAG/CubicBattle4.apk) ($SIZE bytes, sha256 $SHA)" >> "$GITHUB_STEP_SUMMARY"
