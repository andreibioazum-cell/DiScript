name: Build DiScript editor (APK + EXE)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-pc:
    name: Build Windows .exe (PC version)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Zig
        run: pip install ziglang

      - name: Build DiScript.exe
        run: python3 tools/build_pc.py --windows

      - name: Stage Windows package
        run: |
          set -euo pipefail
          mkdir -p build/pc/dist
          cp build/pc/DiScript.exe build/pc/dist/
          cp -r build/pc/assets build/pc/dist/assets
          # The editor only needs a monospaced font.
          test -f build/pc/dist/assets/fonts/DejaVuSansMono.ttf
          # A bare .exe has to work on its own: the asset tree is appended to it.
          python3 tools/embed_assets.py build/pc/assets build/pc/DiScript.exe
          python3 tools/check_embedded_assets.py build/pc/DiScript.exe
          cp build/pc/DiScript.exe build/pc/dist/
          (cd build/pc/dist && zip -qr "$GITHUB_WORKSPACE/DiScript-Windows.zip" DiScript.exe assets)

      - name: Publish Windows .exe to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-build"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "DiScript editor (APK + EXE)" \
              --notes "Automated DiScript editor build (${{ github.sha }})." \
              --prerelease || true
          fi
          sha256sum DiScript-Windows.zip build/pc/DiScript.exe > windows.sha256
          cat windows.sha256
          REPO="${{ github.repository }}"
          ZIP_SIZE="$(stat -c%s DiScript-Windows.zip)"
          EXE_SIZE="$(stat -c%s build/pc/DiScript.exe)"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" DiScript-Windows.zip build/pc/DiScript.exe windows.sha256 --clobber; then
              ZIP_REMOTE="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="DiScript-Windows.zip") | .size' 2>/dev/null || echo 0)"
              EXE_REMOTE="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="DiScript.exe") | .size' 2>/dev/null || echo 0)"
              if [ "$ZIP_REMOTE" = "$ZIP_SIZE" ] && [ "$EXE_REMOTE" = "$EXE_SIZE" ]; then
                echo "windows assets match: $ZIP_REMOTE and $EXE_REMOTE bytes"
                break
              fi
              echo "windows assets mismatch ($ZIP_REMOTE/$EXE_REMOTE), re-uploading"
              for NAME in DiScript-Windows.zip DiScript.exe; do
                ASSET_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$NAME\") | .id" 2>/dev/null || true)"
                if [ -n "$ASSET_ID" ]; then
                  gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID" || true
                fi
              done
            fi
            sleep 2
          done
          echo "### Windows Build Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- [DiScript-Windows.zip (EXE + assets)](https://github.com/${{ github.repository }}/releases/download/$TAG/DiScript-Windows.zip)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [DiScript.exe](https://github.com/${{ github.repository }}/releases/download/$TAG/DiScript.exe)" >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK (Android 8-15)
    runs-on: ubuntu-24.04
    env:
      CC: clang

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java for Android build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and NDK
        id: android-tools
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt" ]; then
            if [ ! -x "$SDKM" ]; then
              TMP="$(mktemp -d)"
              curl -fsSL -o "$TMP/tools.zip" \
                https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
              unzip -q "$TMP/tools.zip" -d "$TMP"
              mkdir -p "$ANDROID_HOME/cmdline-tools"
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
              rm -rf "$TMP"
            fi
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;34.0.0"
          fi
          NDK_PATH=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            for cand in $(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V -r); do
              if [ -x "$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ] && \
                 [ -f "$cand/sources/android/native_app_glue/android_native_app_glue.c" ]; then
                NDK_PATH="$cand"
                break
              fi
            done
          fi
          if [ -z "$NDK_PATH" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "ndk;25.2.9519653"
            NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          fi
          echo "Using NDK: $NDK_PATH"
          echo "ndk-path=$NDK_PATH" >> "$GITHUB_OUTPUT"

      - name: Stage assets
        run: python3 stage_assets.py assets staging/assets

      - name: Build native libraries
        env:
          NDK_ROOT: ${{ steps.android-tools.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"
          C_SOURCES=(src/ide/ide_buffer.c src/ide/ide_highlight.c src/ide/ide_view.c src/ide/ide_app.c src/ide/ide_project.c
                     src/ide/ide_viewport.c
                     src/discript/ds_gc.c src/discript/ds_lexer.c src/discript/ds_parser.c
                     src/discript/ds_compiler.c src/discript/ds_vm.c src/discript/ds_stdlib.c
                     src/discript/ds_love.c src/discript/ds_scene_api.c src/discript/ds_sprite_api.c
                     src/engine/runtime.c src/engine/anim.c
                     src/engine/scene/ds_scene.c src/engine/scene/ds_render3d.c
                     src/platform/android/android_main.c "$GLUE/android_native_app_glue.c")
          CPP_SOURCES=(src/cpp/native_jit.cpp src/cpp/love_noise_physics.cpp src/cpp/ui_fx.cpp)
          C_OPTS=(-std=c99 -O3 -s -fPIC -shared -Isrc -I. -I"$GLUE" -landroid -llog -ldl -lm -lvulkan
                  -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384)
          CPP_OPTS=(-std=c++17 -fno-exceptions -fno-rtti -O3 -s -fPIC -Isrc)
          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64
          pids=()
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            case "$ABI" in
              arm64-v8a) TRIPLE=aarch64-linux-android26;;
              armeabi-v7a) TRIPLE=armv7a-linux-androideabi26;;
              x86_64) TRIPLE=x86_64-linux-android26;;
            esac
            (
              OBJS=()
              for CPP_SRC in "${CPP_SOURCES[@]}"; do
                OBJ="staging/$(basename "${CPP_SRC%.cpp}")_$ABI.o"
                "$TOOLCHAIN/$TRIPLE-clang++" "${CPP_OPTS[@]}" -c "$CPP_SRC" -o "$OBJ"
                OBJS+=("$OBJ")
              done
              "$TOOLCHAIN/$TRIPLE-clang" "${C_OPTS[@]}" "${C_SOURCES[@]}" "${OBJS[@]}" \
                -o "staging/lib/$ABI/libdiscript.so"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          # A shared library links happily with unresolved symbols and only
          # fails when Android dlopen()s it, which the user sees as the app
          # closing instantly with no window. Catch that here instead.
          test -x "$TOOLCHAIN/llvm-nm" || { echo "llvm-nm missing"; exit 1; }
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            LIB="staging/lib/$ABI/libdiscript.so"
            test -s "$LIB" || { echo "missing $LIB"; exit 1; }
            HOLE=$("$TOOLCHAIN/llvm-nm" -D --undefined-only "$LIB" \
                   | grep -E "ds_(register_scene|scene_api_tick|scene_api_get)|scene_(build_mesh|tick|add)$" || true)
            if [ -n "$HOLE" ]; then
              echo "unresolved engine symbols in $LIB:"
              echo "$HOLE"
              exit 1
            fi
            echo "link check $(basename "$(dirname "$LIB")"): ok"
          done

      - name: Package and sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -s staging/classes.dex
          test -s staging/lib/arm64-v8a/libdiscript.so
          test -s staging/lib/armeabi-v7a/libdiscript.so
          test -s staging/lib/x86_64/libdiscript.so
          "$BT/aapt" package -f \
            -M platform/android/AndroidManifest.xml \
            -S platform/android/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -A staging/assets \
            -F unsigned.apk
          (
            cd staging
            zip -q -r ../unsigned.apk classes.dex lib
          )
          unzip -t unsigned.apk >/dev/null
          APK_FILES="$(unzip -Z1 unsigned.apk)"
          for required in \
            assets/fonts/DejaVuSansMono.ttf \
            classes.dex \
            lib/arm64-v8a/libdiscript.so \
            lib/armeabi-v7a/libdiscript.so \
            lib/x86_64/libdiscript.so; do
            grep -Fxq "$required" <<< "$APK_FILES"
          done
          "$BT/aapt" dump badging unsigned.apk > unsigned.badging
          grep -Fq "package: name='com.discript.ide'" unsigned.badging
          "$BT/zipalign" -v 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks platform/android/debug.keystore --ks-type PKCS12 \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out Game.apk aligned.apk
          "$BT/zipalign" -c -v 4 Game.apk
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 26 Game.apk
          unzip -Z1 Game.apk | grep -Eq "META-INF/.*\.(RSA|DSA|EC)$"
          "$BT/aapt" dump badging Game.apk > Game.badging
          grep -Fq "package: name='com.discript.ide'" Game.badging
          unzip -t Game.apk >/dev/null
          cp Game.apk DiScript.apk

      - name: Publish Android APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-build"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "DiScript editor (APK + EXE)" \
              --notes "Automated DiScript editor build (${{ github.sha }})." \
              --prerelease || true
          fi
          SIZE="$(stat -c%s DiScript.apk)"
          SHA="$(sha256sum DiScript.apk | cut -d' ' -f1)"
          printf '%s  DiScript.apk\n' "$SHA" > DiScript.apk.sha256
          echo "local apk: $SIZE bytes, sha256 $SHA"
          REPO="${{ github.repository }}"
          REMOTE=""
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" DiScript.apk DiScript.apk.sha256 --clobber; then
              REMOTE="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="DiScript.apk") | .size' 2>/dev/null || echo 0)"
              if [ "$REMOTE" = "$SIZE" ]; then
                echo "release apk matches: $REMOTE bytes"
                break
              fi
              echo "release apk size $REMOTE != $SIZE, dropping the asset and retrying"
              ASSET_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="DiScript.apk") | .id' 2>/dev/null || true)"
              if [ -n "$ASSET_ID" ]; then
                gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID" || true
              fi
            fi
            sleep 2
          done
          if [ "$REMOTE" != "$SIZE" ]; then
            echo "::error::published APK is $REMOTE bytes, expected $SIZE"
            exit 1
          fi
          gh release edit "$TAG" \
            --notes "$(printf 'Automated Android APK and Windows EXE build (%s).\n\nAPK: %s bytes\nsha256: %s\nThe same hash is in DiScript.apk.sha256 next to the APK.' "${{ github.sha }}" "$SIZE" "$SHA")" >/dev/null 2>&1 || true
          echo "### Android APK Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- [DiScript.apk](https://github.com/${{ github.repository }}/releases/download/$TAG/DiScript.apk) ($SIZE bytes, sha256 $SHA)" >> "$GITHUB_STEP_SUMMARY"
