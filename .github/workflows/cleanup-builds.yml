name: Cleanup Old Builds

on:
  push:
  workflow_run:
    workflows: ["Build Cubic Battle 4 (Pure C)"]
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      keep_latest:
        description: "Completed successful builds to keep (0 wipes all completed builds completely)"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-builds
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    name: Purge old builds, artifacts, logs, and caches
    runs-on: ubuntu-latest
    steps:
      - name: Wipe old workflow runs, artifacts, and caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          KEEP_LATEST_INPUT: ${{ inputs.keep_latest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          REPO = os.environ["REPO"]
          CURRENT_RUN_ID = int(os.environ["CURRENT_RUN_ID"])
          CURRENT_SHA = (os.environ.get("CURRENT_SHA") or "").strip()
          EVENT_NAME = (os.environ.get("EVENT_NAME") or "").strip()
          raw_keep = (os.environ.get("KEEP_LATEST_INPUT") or "").strip()
          BUILD_WORKFLOW_NAME = "Build Cubic Battle 4 (Pure C)"

          # On push, a fresh build is already running for CURRENT_SHA, so wipe 100% of completed old runs.
          # On workflow_run / schedule, keep only the single newest successful build.
          # On workflow_dispatch, honor keep_latest input (default 0 = full wipe).
          if raw_keep.isdigit():
              KEEP_LATEST = max(0, int(raw_keep))
          elif EVENT_NAME in ("workflow_run", "schedule"):
              KEEP_LATEST = 1
          else:
              KEEP_LATEST = 0


          def gh_api(endpoint: str, method: str = "GET") -> tuple[int, object]:
              proc = subprocess.run(
                  ["gh", "api", "-X", method, endpoint],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  if "404" in proc.stderr or "Not Found" in proc.stderr:
                      return 404, None
                  return proc.returncode, proc.stderr.strip()
              if not proc.stdout.strip():
                  return 204, None
              try:
                  return 200, json.loads(proc.stdout)
              except json.JSONDecodeError:
                  return 200, proc.stdout


          def list_paginated(path: str, key: str) -> list[dict]:
              items: list[dict] = []
              page = 1
              while True:
                  sep = "&" if "?" in path else "?"
                  code, data = gh_api(f"{path}{sep}per_page=100&page={page}")
                  if code != 200 or not isinstance(data, dict):
                      print(f"warn: GET {path} page {page} -> {code}: {data}", file=sys.stderr)
                      break
                  batch = data.get(key) or []
                  if not batch:
                      break
                  items.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return items


          # 1. Cancel any stale queued/in_progress runs from older commits first.
          initial_runs = list_paginated(f"repos/{REPO}/actions/runs", "workflow_runs")
          stale_active = [
              int(r["id"])
              for r in initial_runs
              if int(r["id"]) != CURRENT_RUN_ID
              and r.get("status") != "completed"
              and EVENT_NAME == "push"
              and CURRENT_SHA
              and r.get("head_sha") != CURRENT_SHA
          ]
          if stale_active:
              print(f"cancelling {len(stale_active)} superseded active run(s): {stale_active}")
              for rid in stale_active:
                  gh_api(f"repos/{REPO}/actions/runs/{rid}/cancel", "POST")
              time.sleep(5)

          # 2. Snapshot all workflow runs across all pages before deleting anything.
          runs = list_paginated(f"repos/{REPO}/actions/runs", "workflow_runs")
          runs.sort(key=lambda r: r.get("created_at") or "", reverse=True)

          kept_run_ids: set[int] = {CURRENT_RUN_ID}
          kept_builds = 0
          runs_to_delete: list[dict] = []

          for r in runs:
              rid = int(r["id"])
              if rid == CURRENT_RUN_ID:
                  continue
              if r.get("status") != "completed":
                  kept_run_ids.add(rid)
                  continue
              if (
                  r.get("name") == BUILD_WORKFLOW_NAME
                  and r.get("conclusion") == "success"
                  and kept_builds < KEEP_LATEST
              ):
                  kept_run_ids.add(rid)
                  kept_builds += 1
                  continue
              runs_to_delete.append(r)

          # 3. Collect all artifacts not belonging to a kept run.
          artifacts = list_paginated(f"repos/{REPO}/actions/artifacts", "artifacts")
          artifacts_to_delete = [
              a
              for a in artifacts
              if int((a.get("workflow_run") or {}).get("id") or 0) not in kept_run_ids
          ]

          # 4. Collect Actions caches to purge.
          caches = list_paginated(f"repos/{REPO}/actions/caches", "actions_caches")
          caches.sort(key=lambda c: c.get("created_at") or "", reverse=True)
          seen_keys: set[str] = set()
          caches_to_delete: list[dict] = []
          for c in caches:
              ck = str(c.get("key") or "")
              if KEEP_LATEST > 0 and ck and ck not in seen_keys:
                  seen_keys.add(ck)
                  continue
              caches_to_delete.append(c)


          def batch_call(label: str, endpoints: list[str], method: str = "DELETE") -> tuple[int, int]:
              if not endpoints:
                  print(f"{label}: 0 items")
                  return 0, 0
              ok = 0
              fail = 0
              with ThreadPoolExecutor(max_workers=12) as pool:
                  futs = {pool.submit(gh_api, ep, method): ep for ep in endpoints}
                  for fut in as_completed(futs):
                      ep = futs[fut]
                      code, err = fut.result()
                      if code in (200, 202, 204, 404):
                          ok += 1
                      else:
                          fail += 1
                          print(f"warn: {method} {ep} -> {code}: {err}", file=sys.stderr)
              print(f"{label}: {ok} succeeded, {fail} failed")
              return ok, fail


          print(
              f"cleanup plan (event={EVENT_NAME}, keep_latest={KEEP_LATEST}): "
              f"total_runs={len(runs)}, delete_artifacts={len(artifacts_to_delete)}, "
              f"delete_runs={len(runs_to_delete)}, delete_caches={len(caches_to_delete)}"
          )

          batch_call(
              "artifacts",
              [f"repos/{REPO}/actions/artifacts/{a['id']}" for a in artifacts_to_delete],
          )
          batch_call(
              "workflow_runs_logs",
              [f"repos/{REPO}/actions/runs/{r['id']}/logs" for r in runs_to_delete],
          )
          batch_call(
              "workflow_runs",
              [f"repos/{REPO}/actions/runs/{r['id']}" for r in runs_to_delete],
          )
          batch_call(
              "caches",
              [f"repos/{REPO}/actions/caches/{c['id']}" for c in caches_to_delete],
          )
          PY
